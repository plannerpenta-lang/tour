<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tour · Tótems</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tour.css">
</head>
<body>

<div class="brand-top">
  <div class="brand-left">
    <img src="/img/brand/bn-logo.svg" alt="BN" style="height:34px">
  </div>
  <div class="brand-spacer"></div>
  <div class="brand-meta">Tour gamificado · Kiosko</div>
</div>

<div class="screen activa" style="padding-top:32px">
  <div class="frame frame-green" style="margin-top:8px">
    <div class="panel-blanco">
      <h1>Tour BN · Para todo, todos los días</h1>
      <p class="sub">Abre cada URL en el navegador del tótem correspondiente<br>(modo kiosco del sistema).</p>
      <div class="kiosko-grid" style="margin-top:18px">
        <button class="kiosko-btn kiosko-registro" onclick="location.href='/registro.html'">🟢 Tótem 0 · Registro</button>
        <button class="kiosko-btn" onclick="location.href='/estacion.html?e=e1'">🥖 Tótem 1 · Supermercado</button>
        <button class="kiosko-btn" onclick="location.href='/estacion.html?e=e2'">💊 Tótem 2 · Farmacia</button>
        <button class="kiosko-btn" onclick="location.href='/estacion.html?e=e3'">🐾 Tótem 3 · Veterinaria</button>
        <button class="kiosko-btn" onclick="location.href='/estacion.html?e=e4'">⛽ Tótem 4 · Gasolina</button>
        <button class="kiosko-btn" onclick="location.href='/estacion.html?e=e5'">🍝 Tótem 5 · Restaurantes</button>
        <button class="kiosko-btn kiosko-final" onclick="location.href='/final.html'">🎁 Tótem 6 · Premio Final</button>
        <button class="kiosko-btn kiosko-dashboard" onclick="location.href='/dashboard.html'">📊 Dashboard (staff)</button>
      </div>
    </div>
  </div>
</div>

<div class="brand-bottom">
  <div class="brand-left">
    <img src="/img/brand/mastercard.svg" alt="Mastercard" style="height:26px">
    <span style="color:var(--bn-navy); opacity:.4">|</span>
    <img src="/img/brand/bn-logo.svg" alt="BN" style="height:28px">
  </div>
  <div class="brand-spacer"></div>
  <span class="brand-tagline">Para todo, <em>todos los días.</em></span>
</div>

</body>
</html>
