<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tour · Estación</title>
<link rel="stylesheet" href="/css/tour.css">
</head>
<body>

<div class="barra-superior">
  <div class="barra-titulo" id="titulo-estacion">Estación</div>
  <div class="barra-paso" id="paso-estacion"></div>
  <div class="estado-conexion online">En línea</div>
</div>

<div id="pantalla-personajes" class="screen activa">
  <h1 id="bienvenida-titulo">¿Quién eres?</h1>
  <p class="subtitulo">Toca tu personaje para continuar el recorrido</p>
  <div class="grid-personajes" id="grid-personajes"></div>
</div>

<div id="pantalla-sesion" class="screen">
  <div class="avatar-hero" id="sesion-avatar"></div>
  <h1>¡Hola, <span id="sesion-usuario"></span>!</h1>
  <p class="subtitulo">Has acumulado <b style="color:var(--accent2)" id="sesion-puntos">0</b> puntos ·
     <span id="sesion-progreso"></span></p>
  <button class="boton grande" id="boton-visita" onclick="registrarVisita()">✓ Registrar mi visita aquí</button>
  <button class="boton secundario" style="margin-top:14px; width:min(480px,90vw)" onclick="mostrarPantalla('pantalla-personajes')">No soy yo ←</button>
  <button class="boton secundario" style="margin-top:10px; width:min(480px,90vw); font-size:15px; opacity:.7"
    onclick="liberarSesion(sesionActual.sesion_id ?? sesionActual.id, '¿Salir del tour? Tu personaje quedará libre para otros usuarios.')">
    🚪 Salir del tour (liberar mi personaje)</button>
</div>

<div id="pantalla-menu" class="screen">
  <div class="avatar-hero" id="menu-avatar" style="font-size:50px"></div>
  <h1 id="menu-saludo"></h1>
  <p class="subtitulo">Elige tu almuerzo — Menú Típico Tico · ₡5.500</p>
  <div id="grid-menu" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; width:min(900px,94vw)"></div>
  <button class="boton secundario" style="margin-top:14px; width:min(480px,90vw)" onclick="mostrarPantalla('pantalla-personajes')">No soy yo ←</button>
</div>

<div id="pantalla-menu-confirmar" class="screen">
  <div style="font-size:70px" id="confirmar-emoji"></div>
  <h1 id="confirmar-plato"></h1>
  <p class="subtitulo" id="confirmar-desc"></p>
  <p style="color:var(--accent2); font-size:22px; font-weight:800" id="confirmar-puntos"></p>
  <button class="boton grande" onclick="confirmarMenu()">✓ Confirmar mi almuerzo</button>
  <button class="boton secundario" style="margin-top:14px; width:min(480px,90vw)" onclick="mostrarPantalla('pantalla-menu')">Elegir otro</button>
</div>

<div id="pantalla-exito" class="screen">
  <div class="avatar-hero celebrando">🎉</div>
  <h1>¡Visita registrada!</h1>
  <p class="subtitulo">Sigue a la siguiente estación del tour</p>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const CODIGO = params.get('e') || 'e1';
let estacion = null;
let sesionActual = null;
let totalEstaciones = 6;
let codigoAnterior = 'registro';

async function iniciar() {
  try {
    const lista = await api('GET', '/estaciones');
    totalEstaciones = lista.filter(x => x.tipo === 'estacion').length || 6;
    for (const e of lista) NOMBRES_EST[e.codigo] = e.nombre;
    estacion = lista.find(e => e.codigo === CODIGO);
    if (!estacion || estacion.tipo !== 'estacion') {
      document.getElementById('titulo-estacion').textContent = 'Estación no encontrada';
      return;
    }
    const anterior = lista.find(e => e.orden === estacion.orden - 1);
    codigoAnterior = anterior ? anterior.codigo : null;
    document.getElementById('titulo-estacion').textContent = '📍 ' + estacion.nombre;
    document.getElementById('paso-estacion').textContent = `Paso ${estacion.orden} de ${lista.length - 2}`;
    await cargarPersonajes();
  } catch { toast('Error de conexión con el servidor'); }
}

async function cargarPersonajes() {
  const grid = document.getElementById('grid-personajes');
  try {
    const enTour = await api('GET', `/personajes?estado=en_tour&ubicacion=${codigoAnterior}`);
    grid.innerHTML = '';
    if (enTour.length === 0) {
      grid.innerHTML = `<p class="cargando" style="grid-column:1/-1;text-align:center">Nadie ha llegado desde<br><b>${anteriorNombre()}</b> todavía</p>`;
      return;
    }
    for (const p of enTour) {
      const card = document.createElement('div');
      card.className = 'personaje-card';
      card.innerHTML = `<span class="personaje-emoji">${p.avatar}</span><span class="personaje-nombre">${p.nombre}</span>`;
      card.onclick = () => identificar(p);
      grid.appendChild(card);
    }
  } catch { grid.innerHTML = '<p class="cargando" style="grid-column:1/-1;text-align:center">Error de conexión…</p>'; }
}

async function identificar(p) {
  try {
    sesionActual = await api('POST', '/totem/login', { personaje_id: p.id, estacion_codigo: CODIGO });
    const yaVisito = sesionActual.visitadas.some(v => v.codigo === CODIGO);
    if (yaVisito) {
      document.getElementById('sesion-avatar').textContent = sesionActual.avatar;
      document.getElementById('sesion-usuario').textContent = sesionActual.usuario.split(' ')[0];
      document.getElementById('sesion-puntos').textContent = sesionActual.puntos;
      document.getElementById('sesion-progreso').textContent =
        `${sesionActual.visitadas.length} de ${totalEstaciones} estaciones completadas`;
      const boton = document.getElementById('boton-visita');
      boton.textContent = 'Ya registramos tu visita aquí ✓';
      boton.disabled = true;
      mostrarPantalla('pantalla-sesion');
      return;
    }
    if (CODIGO === 'e1') {
      document.getElementById('menu-avatar').textContent = sesionActual.avatar;
      document.getElementById('menu-saludo').textContent = `¡Hola, ${sesionActual.usuario.split(' ')[0]}!`;
      await cargarMenu();
      mostrarPantalla('pantalla-menu');
    } else {
      document.getElementById('sesion-avatar').textContent = sesionActual.avatar;
      document.getElementById('sesion-usuario').textContent = sesionActual.usuario.split(' ')[0];
      document.getElementById('sesion-puntos').textContent = sesionActual.puntos;
      document.getElementById('sesion-progreso').textContent =
        `${sesionActual.visitadas.length} de ${totalEstaciones} estaciones completadas`;
      const boton = document.getElementById('boton-visita');
      boton.textContent = `✓ Registrar mi visita aquí (+${estacion.puntos})`;
      boton.disabled = false;
      mostrarPantalla('pantalla-sesion');
    }
  } catch (err) { toast(err.message); await cargarPersonajes(); }
}

let platoElegido = null;

async function cargarMenu() {
  const grid = document.getElementById('grid-menu');
  grid.innerHTML = '<p class="cargando" style="grid-column:1/-1;text-align:center">Cargando menú…</p>';
  try {
    const platos = await api('GET', '/menu');
    grid.innerHTML = '';
    for (const plato of platos) {
      const card = document.createElement('div');
      const agotado = plato.stock <= 0;
      card.className = 'personaje-card' + (agotado ? ' agotado' : '');
      card.style.opacity = agotado ? '.4' : '1';
      card.style.pointerEvents = agotado ? 'none' : 'auto';
      card.innerHTML = `<span style="font-size:42px">${plato.emoji}</span>
        <span style="font-weight:800; font-size:16px">${plato.nombre}</span>
        <span style="color:var(--muted); font-size:13px">${plato.descripcion}</span>
        <span style="color:${agotado ? 'var(--err)' : 'var(--accent2)'}; font-size:14px; font-weight:700">${agotado ? 'AGOTADO' : '+' + plato.puntos + ' pts · quedan ' + plato.stock}</span>`;
      if (!agotado) card.onclick = () => elegirPlato(plato);
      grid.appendChild(card);
    }
  } catch { grid.innerHTML = '<p class="cargando">Error cargando menú</p>'; }
}

function elegirPlato(plato) {
  platoElegido = plato;
  document.getElementById('confirmar-emoji').textContent = plato.emoji;
  document.getElementById('confirmar-plato').textContent = plato.nombre;
  document.getElementById('confirmar-desc').textContent = plato.descripcion;
  document.getElementById('confirmar-puntos').textContent = `+${plato.puntos} puntos · quedan ${plato.stock} disponibles`;
  mostrarPantalla('pantalla-menu-confirmar');
}

async function confirmarMenu() {
  if (!sesionActual || !platoElegido) return;
  try {
    await api('POST', '/visitas', { sesion_id: sesionActual.sesion_id ?? sesionActual.id, estacion_codigo: CODIGO, plato_id: platoElegido.id });
    mostrarPantalla('pantalla-exito');
    setTimeout(() => location.reload(), 5000);
  } catch (err) { toast(err.message); await cargarMenu(); mostrarPantalla('pantalla-menu'); }
}

async function registrarVisita() {
  if (!sesionActual) return;
  try {
    await api('POST', '/visitas', { sesion_id: sesionActual.sesion_id ?? sesionActual.id, estacion_codigo: CODIGO });
    mostrarPantalla('pantalla-exito');
    setTimeout(() => location.reload(), 5000);
  } catch (err) { toast(err.message); }
}

function anteriorNombre() {
  return codigoAnterior === 'registro' ? 'el Registro' : (NOMBRES_EST[codigoAnterior] || 'la estación anterior');
}
const NOMBRES_EST = {};

socket.on('actualizacion', (msg) => {
  if (['sesion_iniciada', 'premio_entregado', 'sesion_expirada', 'sesion_liberada'].includes(msg.tipo)) {
    if (document.getElementById('pantalla-personajes').classList.contains('activa')) cargarPersonajes();
  }
});

iniciar();
</script>
</body>
</html>
