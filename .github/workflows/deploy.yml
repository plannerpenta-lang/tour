name: Deploy to Droplet

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd ~/tour 2>/dev/null || cd /root/tour 2>/dev/null || (echo "Clonando repo por primera vez" && git clone https://github.com/plannerpenta-lang/tour.git ~/tour && cd ~/tour)
            git pull origin main
            npm ci --omit=dev
            pm2 restart tour --update-env 2>/dev/null || pm2 start ecosystem.config.cjs
            pm2 save
            curl -fs http://localhost:3000/health && echo "Health OK"

